{% load static %}
<header class="site-header">
  <div class="header-container">
    <div class="branding">
      <div class="logo">
        <span class="logo-text">Calling Darjeeling</span>
        <div class="logo-accent"></div>
      </div>
      <div class="tagline">
        <span class="tagline-text">Darjeeling is calling you...!</span>
        <div class="tagline-underline"></div>
      </div>
    </div>

    <div class="contact-info">
      <div class="email-section">
        <div class="email-icon">✉️</div>
        <div class="email-content">
          <span class="email-label">Quick Questions? Email Us</span>
          <a href="mailto:callingdarjeeling@gmail.com" class="email-value">callingdarjeeling@gmail.com</a>
        </div>
      </div>
      
      <div class="action-buttons">
        <a href="https://wa.me/+918967205032" target="_blank" class="whatsapp-button">
          <div class="whatsapp-icon">
            <img src="{% static 'img/whatsapp-icon.png' %}" alt="WhatsApp" />
          </div>
          <span class="whatsapp-text">Chat on WhatsApp</span>
          <div class="button-shine"></div>
        </a>
        
        <a href="/book-tour" class="book-btn">
          <span class="book-text">Book Tour</span>
          <span class="book-arrow">→</span>
          <div class="button-shine"></div>
        </a>
      </div>
    </div>
  </div>
  
  <div class="header-decoration">
    <div class="mountain-silhouette"></div>
  </div>
</header>
